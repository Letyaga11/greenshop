<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Greenshop</title>
    <link rel="stylesheet" href="./styles/css.css" />
    <link rel="stylesheet" href="./styles/reset.css" />
    <link rel="stylesheet" href="./styles/norm.css" />
  </head>
  <body>
    <header class="header container">
      <header class="navbar">
        <div class="logo">
          <img src="./Vector.png" alt="Greenshop" />
          <span font-size: 23px;>Greenshop</span>
        </div>

        <nav class="nav-links">
          <ul class="menu">
            <li><a class="active">Home</a></li>
            <li><a>Shop</a></li>
            <li><a>Plant Care</a></li>
            <li><a>Blogs</a></li>
          </ul>
        </nav>

        <button class="login-btn">
          <img src="./Logout.png" alt="Logout" /> Login
        </button>
      </header>
      <hr />
    </header>
    <hr class="divider" />
    <section class="hero">
      <div class="hero-content">
        <p class="welcome">WELCOME TO GREENSHOP</p>

        <h1>
          LET'S MAKE A<br />
          BETTER <span style="color: #46a358">PLANET</span>

          <br />
        </h1>
        <br />
        <p class="description">
          We are an online plant shop offering a wide range of cheap and trendy
          plants. Use our plants to create an unique Urban Jungle. Order your
          favorite plants!
        </p>
        <button class="shop-btn">Shop Now</button>
      </div>

      <div class="hero-image">
        <img src="./Group 25.png" alt="Plant" />
      </div>
    </section>
  </body>
</html>
